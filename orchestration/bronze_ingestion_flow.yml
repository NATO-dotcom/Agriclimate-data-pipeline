id: agri_climate_bronze_ingestion
namespace: dev
description: Automates the extraction of Postgres crop data and Open-Meteo climate data into the MinIO Bronze layer.

tasks:
  - id: run_extractions
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    warningOnStdErr: false
    commands:
      # 1. Install packages
      - pip3 install pandas sqlalchemy psycopg2-binary boto3 pyarrow requests --target /tmp/pylibs --quiet --break-system-packages
      - export PYTHONPATH="/tmp/pylibs"
      
      # 2. Navigate to the correct folder so Python can find yield.csv
      - cd /app/ingestion
      
      # 3. Re-seed the source database
      - python3 seed_db.py
      
      # 4. Execute the extractions
      - python3 extract_postgres_to_minio.py
      - python3 extract_weather_to_minio.py



# Orchestartion in bronze layer raw data ingestion and duckdb transformations in silver and gold layers

id: agri_climate_bronze_ingestion
namespace: dev
description: Automates the extraction of Postgres crop data and Open-Meteo climate data into the MinIO Bronze layer, and transforms it using DuckDB.

tasks:
  - id: run_extractions
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    warningOnStdErr: false
    commands:
      - pip3 install pandas sqlalchemy psycopg2-binary boto3 pyarrow requests duckdb --target /tmp/pylibs --quiet --break-system-packages
      - export PYTHONPATH="/tmp/pylibs"
      - cd /app/ingestion
      - python3 seed_db.py
      - python3 extract_postgres_to_minio.py
      - python3 extract_weather_to_minio.py
      - python3 transform_duckdb.py

# Orchestration for transformations with dbt
  - id: run_dbt_transformations
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      # 1. Install dbt-duckdb inside the container
      - pip3 install dbt-duckdb --target /tmp/pylibs --quiet --break-system-packages
      # 2. Tell the container where to find the installed dbt commands
      - export PYTHONPATH="/tmp/pylibs"
      - export PATH="/tmp/pylibs/bin:$PATH"
      # 3. Use the Docker container's internal path to your repository
      - cd /app/warehouse/agri_climate_models
      - export DBT_PROFILES_DIR=$(pwd)
      # 4. Run the pipeline
      - dbt build